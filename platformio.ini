; PlatformIO — easy-artnet-interface
;
; Ambientes:
;   w5500_sem_int  -> core 3.x + W5500 polling (sem INT) + Dmx_ESP32
;   w5500_com_int  -> core 2.0.17 + W5500 por interrupção (INT=27) + esp_dmx 3.1.0
;   wt32_eth01     -> core 2.0.17 + LAN8720 (WT32-ETH01)
;   w5500_diag     -> diagnóstico passo a passo do W5500/DMX/Artnet/WebServer
;
; Exemplos:
;   pio run -e w5500_diag -t upload
;   pio device monitor -e w5500_diag
;   pio run -e w5500_sem_int -t upload
;
; Nota: nesta placa o bootloader que o PlatformIO grava entra no loop
; "try 0x4008059c". O script skip_bootloader_upload.py tira as imagens do
; bootloader/partições do comando de upload, por isso `pio run -t upload`
; grava só a app em 0x10000. O bootloader tem de ser o da recovery.

[platformio]
default_envs = w5500_diag

[env]
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
extra_scripts = post:scripts/skip_bootloader_upload.py

[env:w5500_sem_int]
platform = espressif32@8.0.0
board_build.f_cpu = 160000000L
build_flags = -DFW_SEM_INT
lib_deps =
    https://github.com/devarishi7/Dmx_ESP32.git#main
build_src_filter = +<main.cpp>

[env:w5500_com_int]
platform = espressif32@7.1.3
build_flags = -DFW_COM_INT
lib_deps =
    rstephan/ArtnetWifi@^1.6.2
    https://github.com/someweisguy/esp_dmx.git#v3.1.0
build_src_filter = +<main.cpp>

[env:wt32_eth01]
platform = espressif32@7.1.3
build_flags = -DFW_WT32
lib_deps =
    rstephan/ArtnetWifi@^1.6.2
    https://github.com/someweisguy/esp_dmx.git#v3.1.0
build_src_filter = +<main.cpp>

[env:w5500_diag]
platform = espressif32@8.0.0
lib_deps =
    https://github.com/devarishi7/Dmx_ESP32.git#main
build_src_filter = +<diag.cpp>
